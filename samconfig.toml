# ローカルでの sam build / sam deploy 用のデフォルト。
# CI（CodePipeline）は sam package を --image-repository 付きで叩き、デプロイは
# CloudFormation の変更セットアクションで行うため、[deploy] セクションは使わない。

version = 0.1

[default.global.parameters]
stack_name = "interview-copilot-pdf"
region = "us-east-1"

[default.build.parameters]
cached = true
parallel = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
# ローカル検証用: ECR リポジトリを SAM の companion スタックに任せる。
# CI では bootstrap スタックが作る固定リポジトリを --image-repository で渡す。
resolve_image_repos = true
# PdfBucketName / OutputBucketName はアカウント ID を含むためここには書かない。
# ローカルデプロイ時に渡す:
#   sam deploy --parameter-overrides \
#     PdfBucketName=bedrock-artifact-pdf-<account>-us-east-1-an \
#     OutputBucketName=bedrock-artifact-txt-<account>-us-east-1-an
